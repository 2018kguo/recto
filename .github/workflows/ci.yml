name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.129"
  BINARYEN_VERSION: "version_133"
  BINARYEN_SHA256: "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: wasm-bindgen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: binaryen, for wasm-split
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz" -o "$RUNNER_TEMP/binaryen.tar.gz"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - run: npm install --no-audit --no-fund
      - run: cargo test
      - name: JavaScript package
        working-directory: js
        run: |
          npm run build
          npm run typecheck
          npm test
      - name: What a release would download, and that text fetches no part
        run: node scripts/check-wasm-budget.mjs
      - name: The packed package, in Node and in a browser's Web Worker
        timeout-minutes: 25
        run: |
          npx --yes playwright@1.64.1 install-deps chromium
          npm run smoke

  # The same source gives the same wasm: from another directory, and on another system. The pins are
  # hashes of everything the package ships from the build.
  reproducible:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bindgen: x86_64-unknown-linux-musl
            binaryen: x86_64-linux
            binaryen_sha256: "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489"
          - os: macos-latest
            bindgen: aarch64-apple-darwin
            binaryen: arm64-macos
            binaryen_sha256: "ad66da82ac13f163e424b1643f16c6dfcccc98b5966296b43e52d3cab04f84a8"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: wasm-bindgen and binaryen
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/wasm-bindgen-$WASM_BINDGEN_VERSION-${{ matrix.bindgen }}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" --strip-components=1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-${{ matrix.binaryen }}.tar.gz" -o "$RUNNER_TEMP/binaryen.tar.gz"
          echo "${{ matrix.binaryen_sha256 }}  $RUNNER_TEMP/binaryen.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Build here and from another directory
        run: |
          sh scripts/build-wasm.sh
          cp js/wasm/pins.mjs "$RUNNER_TEMP/pins-${{ matrix.os }}.mjs"
          elsewhere="$RUNNER_TEMP/elsewhere/deeper"
          mkdir -p "$elsewhere"
          git archive HEAD | tar -x -C "$elsewhere"
          (cd "$elsewhere" && sh scripts/build-wasm.sh)
          diff "$RUNNER_TEMP/pins-${{ matrix.os }}.mjs" "$elsewhere/js/wasm/pins.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: pins-${{ matrix.os }}
          path: ${{ runner.temp }}/pins-${{ matrix.os }}.mjs

  reproducible-across-systems:
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: diff pins-ubuntu-latest.mjs pins-macos-latest.mjs
