<!doctype html>
<meta charset="utf-8" />
<title>film pane</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1a19; color: #f0efec; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  #head { height: 92px; padding: 14px 20px 0; display: flex; justify-content: space-between; align-items: baseline; }
  #name { font-size: 34px; font-weight: 650; letter-spacing: -0.01em; }
  #name::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--hue); margin-right: 10px; vertical-align: 3px; }
  #time { font-size: 44px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  #sub { position: absolute; top: 60px; left: 20px; right: 20px; font-size: 19px; color: #c3c2b7; font-variant-numeric: tabular-nums; }
  #bar { position: absolute; top: 92px; left: 0; right: 0; height: 5px; background: #3a3a37; }
  #fill { height: 100%; width: 0; background: var(--hue); }
  #scroll { position: absolute; top: 97px; bottom: 0; left: 0; right: 0; overflow: hidden; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; }
  canvas { width: 100%; height: auto; background: #fff; border-radius: 3px; display: block; }
  #wait { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 24px; color: #c3c2b7; }
</style>
<div id="head"><div id="name"></div><div id="time">0.0 s</div></div>
<div id="sub">Starting</div>
<div id="bar"><div id="fill"></div></div>
<div id="scroll"><div id="grid"></div></div>
<div id="wait">Loading the engine</div>
<script type="module" src="./film-page.mjs"></script>
